name: Docker checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build Python 3.12 runtime with locked dependencies
        run: docker build --tag investobot-ci .
      - name: Verify locked environment without network access
        run: docker run --rm --network none -e INVEST_PROMPTS=/data/prompts investobot-ci uv sync --locked
      - name: Run offline behavior and regression tests
        run: docker run --rm --network none -e INVEST_PROMPTS=/data/prompts investobot-ci uv run --locked pytest
      - name: Check explicit project lint configuration
        run: docker run --rm --network none -e INVEST_PROMPTS=/data/prompts investobot-ci uv run --locked ruff check --config pyproject.toml src tests benchmarks scripts fuzz
