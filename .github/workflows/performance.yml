name: Fixed offline performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    # GitHub-hosted ARM isolation; never run PR code on a personal Docker engine.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - name: Read explicitly approved reference
        id: reference
        run: |
          reference=$(docker run --rm --network none -v "$PWD/candidate:/source:ro" python:3.12-slim python -c 'import json; print(json.load(open("/source/benchmarks/reference.json"))["reference_commit"])')
          echo "sha=$reference" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.reference.outputs.sha }}
          path: reference
      - name: Build each revision with its own locked dependencies
        run: |
          docker build --platform linux/arm64 -t invest-perf-reference reference
          docker build --platform linux/arm64 -t invest-perf-candidate candidate
      - name: Compare eight workflows and confirm any slowdown once
        env:
          REFERENCE: ${{ steps.reference.outputs.sha }}
          CANDIDATE: ${{ github.sha }}
        run: |
          mkdir -p results
          engine_arch=$(docker info --format '{{.Architecture}}')
          engine_id=$(docker info --format '{{.ID}}')
          run_case() {
            image=$1
            shift
            image_arch=$(docker image inspect "$image" --format '{{.Architecture}}')
            docker run --rm --network none --cpus=2 --memory=4g \
              -e INVEST_PROMPTS=/data/prompts -e OMP_NUM_THREADS=1 \
              -e OPENBLAS_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
              -e INVEST_PERF_ENGINE_ARCH="$engine_arch" \
              -e INVEST_PERF_ENGINE_ID="$engine_id" \
              -e INVEST_PERF_IMAGE_ARCH="$image_arch" \
              -v "$PWD/candidate:/harness:ro" -v "$PWD/results:/results" \
              "$image" uv run --locked python /harness/scripts/perf.py "$@"
          }
          pair() {
            suffix=$1
            run_case invest-perf-reference warmup --revision "$REFERENCE" --output "/results/reference-warmup$suffix.json"
            run_case invest-perf-candidate warmup --revision "$CANDIDATE" --output "/results/candidate-warmup$suffix.json"
            run_case invest-perf-candidate batches "/results/reference-warmup$suffix.json" "/results/candidate-warmup$suffix.json" --output "/results/batches$suffix.json"
            run_case invest-perf-reference run --revision "$REFERENCE" --batches "/results/batches$suffix.json" --output "/results/reference$suffix.json"
            run_case invest-perf-candidate run --revision "$CANDIDATE" --batches "/results/batches$suffix.json" --output "/results/candidate$suffix.json"
          }
          pair ''
          set +e
          run_case invest-perf-candidate compare /results/reference.json /results/candidate.json --output /results/comparison.json
          status=$?
          set -e
          if [ "$status" = 2 ]; then
            pair '-confirmation'
            run_case invest-perf-candidate compare /results/reference.json /results/candidate.json \
              --confirmation-reference /results/reference-confirmation.json \
              --confirmation-candidate /results/candidate-confirmation.json \
              --output /results/comparison.json
          else
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eight-workflow-performance
          path: results
          retention-days: 30
