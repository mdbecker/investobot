[project]
name = "investobot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "platformdirs>=4",
    "beautifulsoup4>=4",
    "lxml>=5",
    "pandas>=2",
    "numpy>=2",
    "scipy>=1.14",
    "httpx>=0.27",
    "duckdb==1.4.1",
    "sqlite-vec==0.1.6",
]
[project.scripts]
invest = "invest.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-bdd>=8", "ruff>=0.8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel]
packages = ["src/invest"]
[tool.hatch.build.targets.wheel.force-include]
"skills" = "invest/bundled_skills"
[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
